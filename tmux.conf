# Pane border and dim-inactive-pane colors follow the system appearance
# (Dark Mode or Light Mode, on macOS or GNOME). See tmux/scripts/apply-theme.sh
# and tmux/scripts/watch-theme.sh below, near the end of this file.

# ==============================================================================
# Plugins (managed by TPM — ~/.tmux/plugins/tpm)
# TPM requires this env var to know where plugins live
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
# Install: prefix + I    Reload: prefix + r    Update: prefix + U
# ==============================================================================

# Persist sessions across restarts (manual: prefix + Ctrl-s to save, prefix + Ctrl-r to restore)
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save/restore sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g mouse on

# ==============================================================================
# System dark/light mode theming (macOS and GNOME on Linux)
# Sets pane and window colors once at startup, then watches for system
# appearance changes and re-applies them in the background.
# ==============================================================================
run-shell "~/.tmux/scripts/apply-theme.sh"
run-shell -b "~/.tmux/scripts/watch-theme.sh"

# Initialize TPM — must be the last line in this file
# If TPM is not installed, tmux still works; plugins just won't load
if "test -f ~/.tmux/plugins/tpm/tpm" \
   "run '~/.tmux/plugins/tpm/tpm'"
